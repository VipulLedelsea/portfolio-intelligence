name: IntelligentPortfolio
options:
  bundleIdPrefix: com.vipulledelsea
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
targets:
  IntelligentPortfolio:
    type: application
    platform: iOS
    sources:
      - IntelligentPortfolio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vipulledelsea.IntelligentPortfolio
        PRODUCT_NAME: IntelligentPortfolio
        INFOPLIST_KEY_CFBundleDisplayName: IntelligentPortfolio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    scheme:
      testTargets:
        - IntelligentPortfolioTests
  IntelligentPortfolioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IntelligentPortfolioTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: IntelligentPortfolio

