name = "intelligent-portfolio"
main = "dist/server/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "intelligent-portfolio"
database_id = "4153c2d1-f4bf-4a3c-be38-f7e26b0426cd"
migrations_dir = "drizzle"

# One scan per market, each in its own invocation (the free plan allows 50 outgoing requests per run):
# BSE at :05 and forex at :10 every hour, US and BSE every 15 minutes during their trading hours (UTC). There is no manual refresh anywhere.
[triggers]
# Grading of past picks, post-mortems and the learning report run on their own trigger at :30 so they never share a scan's request budget.
crons = ["5 * * * *", "10 * * * *", "30 * * * *", "*/15 13-21 * * 1-5", "*/15 3-10 * * 1-5"]

# Secrets (never commit these); set each with `npx wrangler secret put NAME`:
#   STRIPE_SECRET_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, PAYWALL_ENABLED ("true" to enable the paywall)
# AI ranking: runs on Workers AI through the AI binding above (no key). To use Claude instead, set the secret ANTHROPIC_API_KEY and the variable RANKING_PROVIDER=anthropic.
# Learned rules: set LEARNING_ADMIN_EMAILS (comma separated Google sign-in emails) so only those people can approve or reject rules the learning loop proposes.
# Optional: TWELVE_DATA_API_KEY to use Twelve Data instead of Yahoo for BSE and forex.
